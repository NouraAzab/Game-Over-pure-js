<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Game Over Site">
    <meta name="keywords" content="Game , موقع ألعاب">
    <meta name="author" content="Noura Azab">
    <title>LogIn</title>
    <!-- ?=====================google fonts======================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Nerko+One&display=swap"
        rel="stylesheet">
    <!-- ?=====================Bootstrap5======================= -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- ?=====================font Awesome======================= -->
    <link rel="stylesheet" href="css/all.min.css">
    <!-- ?=====================custom css file======================= -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section id="login" class="login-section">

        <div class="container  rounded-4 overflow-hidden">
            <div class="row   gap-0">
                <!-- img -->
                <div class="col-lg-5  p-0 ">
                    <div class="img">
                    </div>

                </div>
                <!--inputs  -->
                <div class="inputs col-lg-7 px-3 py-4 bg-secondary">
                    <div>
                        <div class="title d-flex justify-content-center align-items-center mb-3">
                            <div class="text-center">
                                <img src="./images/logo-sm.png" alt="logo">
                                <h1 class="inputs-title mt-2">LogIn to Game Over</h1>
                            </div>

                        </div>
                        <!-- =================== -->
                        <form>
                            <div class="row row-cols-sm-1">
                                <div class="col">
                                    <div>
                                        <input type="email" placeholder="Email Address" class="form-control">
                                    </div>
                                </div>
                                <div class="col">
                                    <div>
                                        <input type="password" placeholder="Password" class="form-control">
                                    </div>
                                </div>
                                <div class="col">
                                    <button type="submit" class=" w-100 text-center p-2 rounded-2"
                                        id="Register-btn">LogIn</button>
                                </div>
                                <div class="col">
                                    <div class="d-flex p-2 align-items-center justify-content-center gap-2 small mt-2">
                                        <span class="question">Not a member yet?</span>
                                        <a class="go" href="register.html">Create Account<i
                                                class="fa-solid fa-angle-right"></i></a>
                                    </div>

                                </div>

                            </div>
                        </form>

                    </div>

                </div>
            </div>

        </div>

    </section>


    <!-- ================================ -->
    <!-- change mode | theme -->

    <span class="change-theme"><i class="fa-solid fa-moon fw-bold text-white"></i></span>
    <span class="change-theme"><i class="fa-solid fa-sun fw-bold text-white d-none"></i></span>








    <!-- ?=====================Bootstrap5======================= -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <!-- ?=====================main js file======================= -->
    <script src="js/main.js"></script>

</body>

</html>
